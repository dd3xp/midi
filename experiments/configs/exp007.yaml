# exp007: CosineAnnealingLR + 50% more training steps
# Purpose: Improve diffusion mean RPA via LR scheduling + more training steps
# Changes from exp005:
#   [C1] samples_per_epoch 1180->1770 (59x30), total ~22,000 steps (vs 14,600)
#   [C2] CosineAnnealingLR: lr 2e-4 -> 1e-5 over 200 epochs
# Prerequisite: copy exp005/baseline_best.pt -> exp007/baseline_best.pt
# Expected: Mean RPA 87-91%, Oracle RPA 96-97%, test_loss < 0.028

output_dir: "experiments/checkpoints/exp007"
instruments: ["vn", "tpt", "fl"]
crop_len: 512
seed: 42
save_every: 20

stage2:
  batch_size: 16
  lr: 0.0002
  lr_min: 0.00001
  epochs: 200
  ema_decay: 0.995
  n_diffusion_steps: 1000
  samples_per_epoch: 1770
