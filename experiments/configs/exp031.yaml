# exp031: Multi-Scale Temporal Amp Loss
# Based on exp028 (instrument embedding, best model)
# Hypothesis: Adding multi-scale temporal loss at scales [8, 32] forces the
# amp predictor to match coarse temporal patterns (phrase-level dynamics),
# improving Amp Corr beyond the current best of 0.678.
output_dir: "experiments/checkpoints/exp031"
baseline_checkpoint: "experiments/checkpoints/exp014/baseline_best.pt"
instruments: ["vn", "va", "vc", "fl", "ob", "cl", "sax", "tpt", "tbn", "bn"]
crop_len: 512
seed: 42
save_every: 10

stage2:
  batch_size: 16
  lr: 0.0002
  lr_min: 0.00001
  epochs: 200
  ema_decay: 0.995
  n_diffusion_steps: 1000
  samples_per_epoch: 1860
  n_channels: 1

  # GRU+Attention (exp023 best architecture)
  amp_hidden: 256
  amp_gru_hidden: 128
  amp_gru_layers: 2
  amp_dropout: 0.4
  amp_use_attention: true
  amp_n_attn_heads: 4
  amp_n_attn_layers: 2

  # Instrument conditioning (from exp028)
  amp_instrument_conditioned: true

  # NEW: Multi-scale temporal amp loss
  amp_multiscale: true
  amp_multiscale_scales: [8, 32]
  amp_multiscale_weight: 0.5

  # Optimizer
  freeze_diffusion: true
  diffusion_checkpoint: "experiments/checkpoints/exp017/diffusion_best_ema.pt"
  amp_lr: 0.0001
  amp_weight_decay: 0.001
