# exp050: Residual Amp Diffusion v2 - Residual Normalization + No Instrument Conditioning
# Goal: Fix noise schedule mismatch by normalizing residuals to unit variance
# Core innovation: residual = (gt_norm - predictor_norm) / residual_std
#   exp042 (old residual, no normalization): Corr=0.744
#   exp045 (AmpPredictor alone, no inst): Corr=0.781
#   This experiment: should match ~0.781 at alpha=0 + add diversity at alpha>0
#
# Changes vs exp042:
#   [C1] Residual normalization (train.py): divide residual by residual_std, save to amp_norm_stats.pt
#   [C2] Residual unscaling (evaluate.py): multiply sampled residual by residual_std
#   [C3] Residual augmentation: light jitter only (no scale shift for residual mode)
#   No instrument conditioning: use exp045 AmpPredictor (Corr=0.781)
#   Velocity encoder: exp033 baseline

output_dir: "experiments/checkpoints/exp050"
baseline_checkpoint: "experiments/checkpoints/exp033/baseline_best.pt"
instruments: ["vn", "va", "vc", "fl", "ob", "cl", "sax", "tpt", "tbn", "bn"]
crop_len: 512
seed: 42
save_every: 10

# Stage 3: Residual amp diffusion training
stage3:
  residual: true
  amp_predictor_checkpoint: "experiments/checkpoints/exp045/amp_predictor_best.pt"
  amp_instrument_conditioned: false
  amp_hidden: 256
  amp_gru_hidden: 128
  amp_gru_layers: 2
  amp_dropout: 0.3
  amp_use_attention: true
  amp_n_attn_heads: 4
  amp_n_attn_layers: 2

  batch_size: 16
  lr: 0.0002
  lr_min: 0.00001
  epochs: 300
  ema_decay: 0.995
  n_diffusion_steps: 1000
  samples_per_epoch: 1860

  # Amp augmentation (residual mode: jitter only, no scale shift)
  amp_augment: true
  amp_augment_jitter: 0.02

# For evaluation - f0 diffusion config (must match exp034)
stage2:
  n_diffusion_steps: 1000
  n_channels: 1
  amp_instrument_conditioned: false
  amp_hidden: 256
  amp_gru_hidden: 128
  amp_gru_layers: 2
  amp_dropout: 0.3
  amp_use_attention: true
  amp_n_attn_heads: 4
  amp_n_attn_layers: 2
