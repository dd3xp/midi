# exp055: Encoder Fine-tuning for Amp Prediction
# Goal: Break through amp ceiling by adapting encoder representation
# Base: exp045 (GRU+Attention, best simple no-inst config, Amp Corr 0.781)
# Change: unfreeze encoder with very small lr (2e-6, 25x smaller than amp_lr)
# Hypothesis: f0-optimized encoder may not encode amp-relevant features
# Risk: f0 may degrade since diffusion was trained on frozen encoder output

output_dir: "experiments/checkpoints/exp055"
baseline_checkpoint: "experiments/checkpoints/exp033/baseline_best.pt"
instruments: ["vn", "va", "vc", "fl", "ob", "cl", "sax", "tpt", "tbn", "bn"]
crop_len: 512
seed: 42
save_every: 10

stage2:
  batch_size: 16
  lr: 0.0002
  lr_min: 0.00001
  epochs: 300
  ema_decay: 0.995
  n_diffusion_steps: 1000
  samples_per_epoch: 1860
  n_channels: 1

  # AmpPredictor: GRU+Attention (same as exp045)
  amp_hidden: 256
  amp_gru_hidden: 128
  amp_gru_layers: 2
  amp_dropout: 0.3
  amp_use_attention: true
  amp_n_attn_heads: 4
  amp_n_attn_layers: 2
  amp_instrument_conditioned: false
  amp_note_position_conditioned: false
  amp_f0_conditioned: false
  amp_velocity_conditioned: false
  amp_condition_dropout: 0.0

  # Loss: same as exp045
  amp_corr_weight: 0.3
  amp_grad_weight: 0.2

  # Encoder Fine-tuning (NEW — exp055)
  unfreeze_encoder: true
  encoder_lr: 0.000002    # 2e-6, 25x smaller than amp_lr

  # Frozen f0 diffusion (reuse exp034)
  freeze_diffusion: true
  diffusion_checkpoint: "experiments/checkpoints/exp034/diffusion_best_ema.pt"

  # Optimizer: same as exp045
  amp_lr: 0.00005
  amp_weight_decay: 0.0001

  # Augmentation: same as exp045
  amp_augment: true
  amp_augment_scale: 0.2
  amp_augment_jitter: 0.05
