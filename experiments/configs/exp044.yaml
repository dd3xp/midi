# exp044: Note Position Feature + Remove Instrument Conditioning
# Goal: Improve Amp Corr by giving AmpPredictor explicit note_position (0→1)
#        and removing instrument_conditioned (must-do for generalization).
#
# Changes vs exp039 (best AmpPredictor, Amp Corr=0.807):
#   [C1] amp_instrument_conditioned: false (was true) — remove instrument embedding
#   [C2] amp_note_position_conditioned: true (NEW) — add note_position (0=onset, 1=offset)
#        This gives AmpPredictor a strong inductive bias for ADSR envelope patterns.
#        note_position is already in frame_features[:, :, 3] (position_in_note).
#
# Hypothesis: note_position provides explicit ADSR phase info, which should help
#   the model learn onset attack, sustain, and release patterns without needing
#   to extract this from the 256-dim encoder representation alone.
#   Removing instrument_conditioned forces the model to learn universal patterns.
#
# Architecture: Same as exp039 except input_dim changes:
#   exp039: 256 (cond) + 32 (instrument) = 288 → proj → 256
#   exp044: 256 (cond) + 1 (note_position) = 257 → proj → 256
#
# Expected: Amp Corr >= 0.80 (maintaining quality without instrument info)
# Target: Amp Corr > 0.82

output_dir: "experiments/checkpoints/exp044"
baseline_checkpoint: "experiments/checkpoints/exp033/baseline_best.pt"
instruments: ["vn", "va", "vc", "fl", "ob", "cl", "sax", "tpt", "tbn", "bn"]
crop_len: 512
seed: 42
save_every: 10

stage2:
  batch_size: 16
  lr: 0.0002
  lr_min: 0.00001
  epochs: 300
  ema_decay: 0.995
  n_diffusion_steps: 1000
  samples_per_epoch: 1860
  n_channels: 1

  # AmpPredictor: same capacity as exp039 but with key changes
  amp_hidden: 256
  amp_gru_hidden: 128
  amp_gru_layers: 2
  amp_dropout: 0.3
  amp_use_attention: true
  amp_n_attn_heads: 4
  amp_n_attn_layers: 2
  amp_instrument_conditioned: false       # [C1] REMOVED — no instrument embedding
  amp_note_position_conditioned: true     # [C2] NEW — explicit ADSR phase info
  amp_f0_conditioned: false

  # Loss: same as exp039
  amp_corr_weight: 0.3
  amp_grad_weight: 0.2

  # Diffusion: frozen (reuse exp034)
  freeze_diffusion: true
  diffusion_checkpoint: "experiments/checkpoints/exp034/diffusion_best_ema.pt"

  # Optimizer: same as exp039
  amp_lr: 0.00005
  amp_weight_decay: 0.0001

  # Amplitude augmentation: same as exp039
  amp_augment: true
  amp_augment_scale: 0.2
  amp_augment_jitter: 0.05
