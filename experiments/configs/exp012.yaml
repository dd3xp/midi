# exp012: Baseline amp head — Sigmoid → Softplus (Stage 1)
# Purpose: Improve amp prediction by replacing Sigmoid activation with Softplus
# Root cause: Sigmoid outputs [0,1] but real amp is in [0, ~0.06] (99th pct),
#   wasting 94%+ of output range. Softplus(x) = log(1+exp(x)) > 0, no upper bound.
# Architecture change:
#   File: src/model/baseline.py line 29-31
#   Before: nn.Sigmoid()
#   After:  nn.Softplus()
# Comparison baseline: exp003 (RPA=97.14%, Amp Corr=0.645)
# Expected: Amp Corr improvement (>0.65), f0 RPA should remain ~97%

output_dir: "experiments/checkpoints/exp012"
instruments: ["vn", "tpt", "fl"]
crop_len: 512
seed: 42
save_every: 10

stage1:
  batch_size: 32
  lr: 0.001
  epochs: 100
  lam: 1.0
  patience: 15
  lr_patience: 5
  lr_factor: 0.5
  dropout: 0.3
